<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerBot — Job Details</title>

    <style>
        :root{
            --dark:#17231f;
            --text:#5d6b65;
            --muted:#89948f;
            --mint:#69c7a3;
            --mint-dark:#438e70;
            --lavender:#9182e8;
            --blue:#79b7df;
            --cream:#fbfcf9;
            --white:#ffffff;
            --border:rgba(35,55,45,.09);
            --shadow:0 25px 70px rgba(40,60,50,.08);
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Inter,Arial,Helvetica,sans-serif;
            background:linear-gradient(180deg,#fbfcf9 0%,#f6faf7 100%);
            color:var(--dark);
            min-height:100vh;
        }

        a{
            color:inherit;
            text-decoration:none;
        }

        .container{
            width:min(1160px,calc(100% - 40px));
            margin:auto;
        }

        header{
            padding:22px 0;
            border-bottom:1px solid var(--border);
            background:rgba(255,255,255,.9);
            backdrop-filter:blur(14px);
            position:sticky;
            top:0;
            z-index:10;
        }

        .nav{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:25px;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:10px;
            font-size:20px;
            font-weight:800;
        }

        .logo img{
            width:43px;
            height:43px;
            object-fit:contain;
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:25px;
        }

        .nav-links a{
            color:var(--text);
            font-size:14px;
            font-weight:600;
        }

        .nav-links a:hover{
            color:var(--mint-dark);
        }

        .nav-btn{
            padding:11px 18px;
            border-radius:12px;
            background:var(--dark);
            color:white !important;
        }

        .progress-wrap{
            background:white;
            border-bottom:1px solid var(--border);
        }

        .progress-inner{
            padding:15px 0;
        }

        .progress-top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:8px;
            font-size:12px;
            color:var(--muted);
            font-weight:700;
        }

        .progress-bar{
            width:100%;
            height:7px;
            background:#e9efeb;
            border-radius:20px;
            overflow:hidden;
        }

        .progress-fill{
            width:100%;
            height:100%;
            background:linear-gradient(135deg,var(--mint),var(--lavender));
            border-radius:20px;
        }

        .back{
            display:inline-flex;
            margin-top:34px;
            color:var(--mint-dark);
            font-size:14px;
            font-weight:700;
        }

        .hero{
            margin-top:20px;
            padding:42px;
            border-radius:30px;
            background:linear-gradient(135deg,#edf9f4,#f0edff);
            border:1px solid rgba(105,199,163,.18);
            box-shadow:var(--shadow);
        }

        .hero-label{
            display:inline-block;
            padding:7px 12px;
            border-radius:999px;
            background:white;
            color:var(--mint-dark);
            font-size:12px;
            font-weight:800;
            margin-bottom:16px;
        }

        .hero h1{
            font-size:clamp(34px,5vw,58px);
            line-height:1.05;
            letter-spacing:-1.8px;
            margin-bottom:15px;
        }

        .hero p{
            max-width:760px;
            color:var(--text);
            font-size:17px;
            line-height:1.7;
        }

        .meta{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:25px;
        }

        .meta span{
            background:white;
            border:1px solid var(--border);
            padding:10px 14px;
            border-radius:12px;
            color:var(--text);
            font-size:13px;
            font-weight:700;
        }

        .main-grid{
            display:grid;
            grid-template-columns:1.55fr .8fr;
            gap:25px;
            margin:28px 0 70px;
        }

        .card{
            background:white;
            border:1px solid var(--border);
            border-radius:24px;
            padding:30px;
            box-shadow:var(--shadow);
        }

        .card + .card{
            margin-top:22px;
        }

        .card h2{
            font-size:23px;
            margin-bottom:17px;
        }

        .card p{
            color:var(--text);
            line-height:1.75;
            font-size:15px;
        }

        .list{
            display:grid;
            gap:12px;
            margin-top:8px;
        }

        .list-item{
            padding:14px 15px;
            background:#f8faf9;
            border:1px solid var(--border);
            border-radius:14px;
            color:var(--text);
            line-height:1.55;
            font-size:14px;
        }

        .skills{
            display:flex;
            flex-wrap:wrap;
            gap:9px;
        }

        .skill{
            padding:9px 12px;
            border-radius:10px;
            background:#f0faf5;
            color:var(--mint-dark);
            font-size:13px;
            font-weight:700;
        }

        .side-card{
            position:sticky;
            top:110px;
            height:max-content;
        }

        .match{
            padding:20px;
            border-radius:18px;
            background:linear-gradient(135deg,#f0faf5,#f2efff);
            margin-bottom:20px;
        }

        .match small{
            color:var(--muted);
            font-weight:700;
        }

        .match strong{
            display:block;
            font-size:36px;
            margin-top:4px;
        }

        .apply-btn{
            display:block;
            text-align:center;
            padding:15px 20px;
            border-radius:14px;
            background:linear-gradient(135deg,var(--mint),var(--lavender));
            color:white;
            font-weight:800;
            margin-bottom:12px;
        }

        .secondary-btn{
            display:block;
            text-align:center;
            padding:14px 20px;
            border-radius:14px;
            background:#f4f7f5;
            color:var(--dark);
            font-weight:700;
        }

        .note{
            margin-top:20px;
            padding:15px;
            border-left:4px solid var(--mint);
            background:#f7fbf9;
            color:var(--text);
            font-size:13px;
            line-height:1.6;
            border-radius:8px;
        }

        .empty{
            text-align:center;
            padding:90px 20px;
        }

        .empty h1{
            font-size:38px;
            margin-bottom:12px;
        }

        .empty p{
            color:var(--text);
            margin-bottom:25px;
        }

        footer{
            padding:30px 0 45px;
            text-align:center;
            color:var(--muted);
            font-size:13px;
        }

        @media(max-width:850px){
            .nav-links{
                display:none;
            }

            .main-grid{
                grid-template-columns:1fr;
            }

            .side-card{
                position:static;
            }
        }

        @media(max-width:600px){
            .container{
                width:min(100% - 24px,1160px);
            }

            .hero,
            .card{
                padding:23px;
                border-radius:20px;
            }

            .hero h1{
                letter-spacing:-1px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
<script>
/* CareerBot authenticated-page guard */
(async function () {
    try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error || !data.session) {
            const next = encodeURIComponent(window.location.pathname.split("/").pop() + window.location.search);
            window.location.replace("login.html?next=" + next);
        }
    } catch (error) {
        console.error("CareerBot session check failed:", error);
        window.location.replace("login.html");
    }
})();
</script>

    <script src="script.js"></script>

</head>

</body>
</html>
